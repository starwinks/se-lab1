<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>栖行 · 酒店预订系统</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="ui.css"><script src="screens.js"></script></head><body><main id="app"></main><script>
const $=s=>document.querySelector(s);const route=s=>location.href='?screen='+s;
const link=(s,t,c='')=>`<a href="?screen=${s}" class="${c}">${t}</a>`;
const btn=(t,s='search',c='')=>link(s,t,'btn '+c);
const badge=(t,c='')=>`<span class="badge ${c}">${t}</span>`;
const field=(l,v)=>`<div class="field"><label>${l}</label><div class="fake">${v}</div></div>`;
const info=(a,b)=>`<div class="info-line"><span>${a}</span><strong>${b}</strong></div>`;
const notice=(t,c='')=>`<div class="notice ${c}">${t}</div>`;
const art=(variant=0)=>`<div class="hotel-art"><img src="assets/${['hotel-1.jpg','hotel-2.jpg','room-1.jpg','room-2.jpg','room-3.jpg'][variant%5]}" alt="客房设计示意"></div>`;
const heroArt=()=>`<div class="hero-art">${art()}</div>`;
function customerHeader(){const active=new URLSearchParams(location.search).get('screen');return `<header class="top"><a href="?screen=search" class="brand">栖行<span class="brand-line"></span><em>QIXING<br>STAY</em></a><nav class="links">${link('search','发现酒店',!['orders','order','modify','cancel'].includes(active)?'active':'')}${link('orders','我的行程',['orders','order','modify','cancel'].includes(active)?'active':'')}<span class="nav-sep"></span>${link('login','<span class="avatar">林</span>林悦　⌄')}</nav></header>`}
function customer(content){return customerHeader()+`<section class="customer">${content}</section>`}
const nav=[['desk','工作概览'],['desk','订单管理'],['inventory','日历与库存'],['rooms','实体客房'],['roomtypes','房型资料'],['closure','待协调订单'],['stats','业务统计']];
const adminNav=[['hotels','酒店资料'],['access','人员与授权'],['closure','停业与协调'],['stats','全平台统计'],['audit','操作日志']];
function navIcon(i){return `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3" y="3" width="14" height="14" rx="2"/>${i%3===0?'<path d="M3 8h14M8 8v9"/>':i%3===1?'<path d="M6 7h8M6 10h8M6 13h5"/>':'<path d="M7 1v4M13 1v4M3 7h14M7 11h1M11 11h1M7 14h1M11 14h1"/>'}</svg>`}function work(content,active='desk',platform=false){return `<div class="admin"><aside class="side"><div class="brand">栖行<span class="brand-line"></span><em>WORK<br>SPACE</em></div><div class="side-hotel"><span>${platform?'平台管理中心':'梧桐里 · 南京'}</span><span>⌄</span></div><div class="side-label">${platform?'平台管理':'酒店业务'}</div>${(platform?adminNav:nav.slice(1)).map(([s,t],i)=>link(s,navIcon(i)+t,active===s?'active':'')).join('')}<div class="bottom"><span class="avatar">${platform?'许':'陈'}</span>${platform?'许经理':'陈晓'}<p>${platform?'平台管理员':'酒店工作人员'} · 在线<br>${link('search','切换到顾客端 ↗')}</p></div></aside><section class="work"><header class="work-top"><span><span class="workspace-switch">${platform?'平台管理':'酒店工作台'}</span>　 /　${({'desk':'订单管理','inventory':'日历与库存','rooms':'实体客房','roomtypes':'房型资料','closure':'停业与协调','stats':'业务统计','access':'人员与授权','audit':'操作日志','hotels':'酒店资料'})[active]||'订单处理'}</span><span>2026年11月06日, 星期五　　◷ 10:20　　<span class="avatar">${platform?'许':'陈'}</span></span></header><div class="work-main">${content}</div></section></div>`}
function table(head,rows){return `<table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
const metrics=arr=>`<div class="stats">${arr.map(([t,v,h])=>`<div class="stat"><div class="muted small">${t}</div><div class="val mono">${v}</div><div class="hint">${h}</div></div>`).join('')}</div>`;
const pageHead=(title,sub,action='')=>`<div class="row between"><div><h1 class="title">${title}</h1><p class="subtitle">${sub}</p></div>${action}</div>`;
const summary=()=>`<aside class="panel summary-panel">${art()}<span class="eyebrow">YOUR STAY</span><h2>栖行 · 梧桐里</h2><p class="muted small">庭院大床房 · 1间</p><hr class="divider">${info('入住','11月06日, 周五')}${info('退房','11月08日, 周日')}${info('人数 / 晚数','2位成人 · 2晚')}<hr class="divider">${info('11月06日晚','¥340')}${info('11月07日晚','¥340')}<div class="total"><span class="small">全程金额</span><strong class="price">¥680</strong></div><p class="muted" style="font-size:10px;margin:18px 0 0">按本次提交时的房价保存订单金额.</p></aside>`;
const tabs=(active='全部')=>`<nav class="tabs">${['全部','待确认','已确认','已入住','已完成','已取消'].map(t=>link('orders',t,t===active?'active':'')).join('')}</nav>`;
const screens={};
screens.login=()=>`<div class="login"><section class="login-left"><div class="brand">栖行 <em>QIXING STAY</em></div><h1>每一程,<br>都有安心的落脚处.</h1><p>从一晚的房价, 到整个行程的安排,<br>清楚预订, 从容入住.</p>${heroArt()}</section><section class="login-right"><p class="gold small">WELCOME TO QIXING</p><h1 class="title">欢迎回来</h1><p class="subtitle">登录后查看和管理你的预订.</p><div class="tabs"><a class="active">顾客登录</a><a>酒店工作人员</a><a>平台管理员</a></div>${field('邮箱','linyue@example.com')}${field('密码','••••••••••••')}<div class="row between small muted"><span>☑ 记住此设备</span><a>忘记密码?</a></div><div style="margin-top:27px">${btn('登录并继续','search','wide')}</div><p class="small muted" style="text-align:center">还没有账号? <a class="action">注册顾客账号</a></p><hr class="divider"><p class="muted small">工作人员和管理员使用已分配的账号登录.</p></section></div>`;
screens.search=()=>customer(`<div class="hero"><p class="gold small">A STAY TO REMEMBER</p><h1>在南京, 找一处喜欢的停留.</h1><p>按整个住宿区间查看可订房型, 行程安排更清楚.</p>${heroArt()}</div><div class="searchbar">${field('目的地','南京')}${field('入住 / 退房','2026-11-06　→　2026-11-08')}${field('入住人数','2位成人 · 每单1间')}${btn('搜索酒店','search')}</div><div class="row">${['全部房型','大床房','双床房','¥600–¥1000 / 全程','可预订'].map((t,i)=>`<span class="pill ${i===0?'on':''}">${t}</span>`).join('')}</div><div class="list-head"><strong>为你找到 3 家可订酒店</strong><span class="muted small">按所选2晚总价筛选 · 综合推荐　⌄</span></div>${[['栖行 · 梧桐里','玄武区 · 距地铁站320米','安静庭院 / 近城墙 / 可取消','340'],['栖行 · 江畔居','建邺区 · 江边步道旁','江景房型 / 宽敞客房 / 可取消','420'],['栖行 · 青石巷','秦淮区 · 老城慢行街区','古城风貌 / 步行友好 / 可取消','368']].map((r,i)=>`<article class="hotel-card">${art(i%2)}<div class="hotel-info"><h2>${r[0]}</h2>${badge('全程有房')}<p>${r[1]}</p><p>${r[2]}</p><p>11月06日–11月08日 · 2晚 · 2人</p></div><div class="hotel-price"><div><div class="price">¥${Number(r[3])*2}<small> / 全程2晚</small></div><div class="small muted">每晚 ¥${r[3]} 起</div></div>${btn('查看房型','hotel','secondary')}</div></article>`).join('')}`);
screens.hotel=()=>customer(`<div class="crumb">南京酒店 / 栖行 · 梧桐里</div><div class="row between"><div><h1 class="title">栖行 · 梧桐里</h1><p class="subtitle">南京市玄武区梧桐路18号　 ·　近地铁 / 安静庭院</p></div><span class="pill">2026-11-06 → 11-08 · 2晚 · 2人</span></div><div class="detail-hero">${art()}${art(1)}</div><div class="panel"><div class="row between"><h2 class="section">选择适合你的房型</h2><span class="small muted">价格按所选日期展示</span></div>${[['庭院大床房','1张1.8米大床 · 最多2人','340','全程余1间'],['雅致双床房','2张1.2米单床 · 最多2人','380','全程余3间']].map(r=>`<div class="room-row"><div><h3>${r[0]}</h3><span class="muted small">${r[1]}</span></div><div><span class="badge">入住前可取消 · 费用0</span><p class="small muted">独立卫浴 / 无烟客房</p></div><div><span class="price">¥${Number(r[2])*2}<small> / 全程2晚</small></span><p class="small gold">${r[3]}</p></div>${btn('预订','booking')}</div>`).join('')}</div>${notice('可订结果覆盖入住日到退房前一天. 提交时会再次检查每晚库存与停售状态.')}`);
screens.booking=()=>customer(`<div class="crumb">酒店详情 / 填写预订</div><h1 class="title">确认你的入住安排</h1><div class="steps"><span class="active"><i>1</i>填写预订</span><span>──</span><span><i>2</i>酒店确认</span><span>──</span><span><i>3</i>到店入住</span></div><div class="split"><div><section class="panel"><h2 class="section">入住人信息</h2><div class="form-grid">${field('入住人姓名 *','林悦')}${field('联系邮箱 *','linyue@example.com')}</div><p class="small muted">请核对入住人, 以便到店办理入住.</p><hr class="divider"><h2 class="section">预订政策</h2>${info('确认方式','酒店工作人员确认')}${info('等待期限','本次提交成功后30分钟')}${info('取消政策','实际办理入住前可取消, 费用0')}${new URLSearchParams(location.search).get("variant")==="duplicate"?`<div class="notice amber"><strong>发现相同行程</strong><br>你已有一笔相同酒店、房型及日期的预订. 如果确实需要第二间房, 可以继续创建; 原订单不会被覆盖.<p><a class="action" href="?screen=order">查看已有订单 QX261102009 →</a></p></div><label class="small">☑ 我已核对行程, 确认需要继续预订.</label>`:""}</section><div class="footer-actions">${btn('返回修改','hotel','secondary')}${btn(new URLSearchParams(location.search).get('variant')==='duplicate'?'确认继续创建新订单':'提交预订','order')}</div></div>${summary()}</div>`);
screens.orders=()=>customer(`${pageHead('我的订单','每段行程, 都在这里.')} ${tabs()}${[['QX261106001','栖行 · 梧桐里','11月06日 → 11月08日','待确认','680','amber'],['QX261102018','栖行 · 江畔居','11月12日 → 11月14日','已确认','840',''],['QX261028009','栖行 · 青石巷','10月28日 → 10月30日','已完成','736','gray']].map((r,i)=>`<section class="panel" style="margin-bottom:20px"><div class="row between"><span class="muted small">订单 ${r[0]}</span>${badge(r[3],r[5])}</div><hr class="divider"><div class="row">${art(i%2)}<div class="grow"><h2 class="section">${r[1]}</h2><p>${r[2]}　2晚 · 1间</p><p class="muted small">${i===0?'等待酒店确认 · 剩余 29:59':'庭院大床房 · 林悦'}</p></div><div style="text-align:right"><div class="price">¥${r[4]}</div><p>${btn('查看订单','order','secondary')}</p></div></div></section>`).join('')}`);
screens.order=()=>customer(`<div class="crumb">我的订单 / QX261106001</div><div class="split"><div><div class="panel"><div class="row between"><div><h1 class="title">预订已提交, 等待酒店确认</h1><p class="muted">订单 QX261106001</p></div>${badge('待确认','amber')}</div><div class="notice"><strong>本轮确认剩余 29:59</strong><br>超过30分钟仍未确认, 订单会自动取消并释放名额.</div><div class="timeline"><div class="on">提交成功<span>11月06日 10:20</span></div><div>酒店确认<span>等待处理</span></div><div>到店入住<span>11月06日</span></div><div>退房完成<span>11月08日</span></div></div></div><div class="panel"><h2 class="section">订单信息</h2>${info('入住人','林悦')}${info('联系邮箱','linyue@example.com')}${info('创建时间','2026-11-06 10:20:00')}${info('当前确认周期','2026-11-06 10:20:00 起')}<hr class="divider"><div class="row between"><span class="small muted">实际办理入住前可修改或取消.</span><div>${btn('修改预订','modify','secondary')} ${btn('取消订单','cancel','secondary')}</div></div></div><div class="notice amber">如果网络中断后重复提交, 请先查看本订单. 同一次提交不会产生第二笔订单.</div></div>${summary()}</div>`);
screens.modify=()=>customer(`<div class="crumb">我的订单 / 修改预订</div>${pageHead('调整行程','订单 QX261106001 · 当前状态: 已确认')}<div class="split"><div><div class="panel"><h2 class="section">新的入住安排</h2><div class="form-grid">${field('入住日期 *','2026-11-07')}${field('退房日期 *','2026-11-09')}${field('房型 *','庭院大床房')}${field('入住人 *','林悦')}</div><hr class="divider"><h2 class="section">修改前后对照</h2>${table(['','原预订','新预订'],[['入住 / 退房','11月06日 / 11月08日','11月07日 / 11月09日'],['住宿晚数','2晚','2晚'],['保存金额','¥680','¥740'],['订单状态','已确认','重新进入待确认']])}${notice('修改成功后, 酒店需重新确认, 从本次修改成功时重新计时30分钟. 修改失败则保留原订单和原行程.','amber')}</div><div class="footer-actions">${btn('保留原预订','order','secondary')}${btn('确认修改 · ¥740','order')}</div></div><div class="panel"><h2 class="section">新行程费用</h2>${info('11月07日晚','¥360')}${info('11月08日晚','¥380')}<div class="total"><span>新订单金额</span><span class="price">¥740</span></div><p class="small muted">改期或换房型按修改时房价重新计价.</p><hr class="divider"><p class="callout">整段行程都校验成功后才替换原预订, 不会只改成功其中一晚.</p></div></div>`);
screens.cancel=()=>customer(`<div class="crumb">我的订单 / 取消预订</div><div class="modal"><span class="badge amber">请确认</span><h1 style="margin-top:17px">确定取消这次预订?</h1><p class="muted">取消后原订单将保留, 但不能恢复. 如需再次入住, 请重新预订.</p><hr class="divider">${info('酒店 / 房型','栖行 · 梧桐里 / 庭院大床房')}${info('住宿日期','11月06日 → 11月08日 · 2晚')}${info('当前状态','已确认')}${info('取消费用','¥0')}<div class="notice">尚未实际办理入住, 本订单可以取消. 各晚占用将一并释放.</div><div class="footer-actions">${btn('保留预订','order','secondary')}${btn('确认取消','orders')}</div><p class="small muted" style="margin-top:24px">若酒店已完成入住办理, 将无法取消, 请联系前台处理后续住宿安排.</p></div>`);
screens.desk=()=>work(`${pageHead('订单管理','仅显示你获授权酒店的订单.',btn('办理入住','checkin'))}${metrics([['待确认','12','2笔临近确认期限'],['今日计划入住','18','已办理 11 笔'],['当前入住','32','以实际入住状态统计'],['待协调','3','临时停业相关']])}<div class="panel"><div class="filters">${field('下单日期','2026-11-06 → 11-06')}${field('当前状态','全部状态')}${field('订单 / 入住人','搜索订单号或姓名')}${btn('查询','desk','secondary')}</div>${table(['订单号 / 入住人','住宿日期','保存金额','当前状态','确认期限','操作'],[['QX261106001<br><span class="muted">林悦</span>','11/06 → 11/08','¥680',badge('待确认','amber'),'剩余 29:59',`<a class="action" href="?screen=order">查看</a>　<a class="action">确认</a>`],['QX261106002<br><span class="muted">周远</span>','11/06 → 11/08','¥680',badge('已确认'),'-',link('checkin','办理入住','action')],['QX261106003<br><span class="muted">陈琳</span>','11/06 → 11/07','¥380',badge('已入住'),'-',link('checkout','办理退房','action')],['QX261106004<br><span class="muted">李晴</span>','11/06 → 11/08','¥680',badge('已取消','gray'),'已超时',`<span class="muted">查看记录</span>`]])}<div class="range-label">筛选按订单首次创建日期和当前状态计算, 改期不改变原创建日期.</div></div>`,'desk');
screens.checkin=()=>work(`${pageHead('办理入住','订单 QX261106002 · 当前状态: 已确认')}<div class="split" style="grid-template-columns:1fr 330px"><div class="panel"><h2 class="section">选择可用客房</h2><div class="notice">仅可分配所属酒店、匹配房型且当前空闲的实体客房.</div><div class="room-board" style="grid-template-columns:repeat(3,1fr)">${[['301','空闲','free'],['302','待清洁','clean'],['303','维修中','repair'],['305','空闲','free'],['306','已入住','used'],['307','空闲','free']].map(r=>`<div class="room-tile ${r[2]}"><strong>${r[0]}</strong><p>庭院大床房</p>${badge(r[1],r[2]==='free'?'':'gray')}</div>`).join('')}</div><div class="footer-actions"><span class="muted small">已选择 301 房</span>${btn('确认办理入住','rooms')}</div></div><div class="panel"><h2 class="section">核对订单</h2>${info('入住人','周远')}${info('房型','庭院大床房')}${info('入住 / 退房','11月06日 / 11月08日')}${info('分配房间','301')}<hr class="divider"><p class="small muted">办理成功后订单变为已入住, 客房变为已入住. 此后顾客不能再普通修改或取消.</p></div></div>`,'desk');
