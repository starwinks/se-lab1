const $=s=>document.querySelector(s);const route=s=>location.href='?screen='+s;
const link=(s,t,c='')=>`<a href="?screen=${s}" class="${c}">${t}</a>`;

const tabs=(active='全部')=>`<nav class="tabs">${['全部','待确认','已确认','已入住','已完成','已取消'].map(t=>link('orders',t,t===active?'active':'')).join('')}</nav>`;
const screens={};
screens.login=()=>`<div class="login"><section class="login-left"><div class="brand">栖行 <em>QIXING STAY</em></div><h1>每一程,<br>都有安心的落脚处.</h1><p>从一晚的房价, 到整个行程的安排,<br>清楚预订, 从容入住.</p>${heroArt()}</section><section class="login-right"><p class="gold small">WELCOME TO QIXING</p><h1 class="title">欢迎回来</h1><p class="subtitle">登录后查看和管理你的预订.</p><div class="tabs"><a class="active">顾客登录</a><a>酒店工作人员</a><a>平台管理员</a></div>${field('邮箱','linyue@example.com')}${field('密码','••••••••••••')}<div class="row between small muted"><span>☑ 记住此设备</span><a>忘记密码?</a></div><div style="margin-top:27px">${btn('登录并继续','search','wide')}</div><p class="small muted" style="text-align:center">还没有账号? <a class="action">注册顾客账号</a></p><hr class="divider"><p class="muted small">工作人员和管理员使用已分配的账号登录.</p></section></div>`;

screens.access=()=>work(`${pageHead('人员与酒店授权','按角色和酒店范围授予权限, 每次受保护操作重新检查.',btn('配置授权','access'))}<div class="panel">${table(['人员','角色','授权酒店','状态','操作'],[['陈晓<br><span class="muted">staff-01</span>','酒店工作人员','梧桐里',badge('有效'),'<span class="action">调整授权</span>'],['许经理<br><span class="muted">admin-01</span>','平台管理员','平台级',badge('有效'),'<span class="action">查看权限</span>'],['周宁<br><span class="muted">staff-02</span>','酒店工作人员','江畔居',badge('有效'),'<span class="action">调整授权</span>']])}</div><div class="panel"><h2 class="section">配置陈晓的酒店范围</h2><p class="muted small">角色: 酒店工作人员</p><div class="row"><span class="pill on">☑ 梧桐里</span><span class="pill">☐ 江畔居</span><span class="pill">☐ 青石巷</span></div><hr class="divider"><p class="callout">工作人员只可处理授权酒店的数据. 变更会留下修改前后范围与操作结果, 顾客不能访问此页面.</p><div class="footer-actions"><button class="secondary">取消</button><button>保存授权</button></div></div>`,'access',true);
screens.stats=()=>work(`${pageHead('订单业务统计','按订单首次创建日期选取同一批订单, 再按当前状态汇总.')}<div class="panel"><div class="filters">${field('统计酒店','全部酒店')}${field('下单日期','2026-11-06 → 2026-11-06')}${btn('更新统计','stats')}</div><p class="small muted">日期均为UTC+8自然日, 含起止日. 改期不改变订单首次创建日期.</p></div>${metrics([['订单总数','128','按所选下单日期'],['当前已取消','16','包含超时取消'],['当前已完成金额','¥23,460','仅合计已完成订单保存金额'],['当前已完成','62','辅助核对金额明细']])}<div class="grid2"><div class="panel"><h2 class="section">各酒店订单数量</h2>${[['梧桐里',58,100],['江畔居',43,74],['青石巷',27,47]].map(r=>`<div class="row between small"><span>${r[0]}</span><strong>${r[1]}笔</strong></div><div class="bar"><div style="width:${r[2]}%"></div></div>`).join('')}</div><div class="panel"><h2 class="section">金额统计口径</h2>${info('纳入','本批订单当前已完成')}${info('金额','订单保存的成交金额')}${info('排除','已取消及其他未完成订单')}<hr class="divider"><p class="small muted">入住或完成日期在范围内, 但创建日期在范围外的订单不纳入. 此处不是收款或资金结算报表.</p></div></div>`,'stats',true);
screens.audit=()=>work(`${pageHead('关键操作日志','成功变更、失败尝试与补记结果均可追溯.')}<div class="panel"><div class="filters">${field('操作时间','2026-11-06 00:00 → 23:59')}${field('操作对象','全部对象')}${field('结果','全部')}${btn('查询日志','audit','secondary')}</div>${table(['时间 / 操作人','对象','动作','结果','详情'],[['10:32:15 / 陈晓','库存: 大床房 · 11/07','总量 10 → 8',badge('拒绝','red'),'<span class="action">查看前后内容</span>'],['10:31:09 / 陈晓','订单 QX261106002','已确认 → 已入住',badge('成功'),'<span class="action">查看前后内容</span>'],['10:30:01 / 系统','订单 QX261106004','待确认 → 已取消',badge('超时取消','gray'),'<span class="action">查看版本与期限</span>'],['10:29:48 / 许经理','人员 staff-01','酒店授权变更',badge('成功'),'<span class="action">查看授权范围</span>']])}</div><div class="panel"><h2 class="section">失败尝试详情</h2>${info('操作对象','大床房 · 2026-11-07')}${info('提交的总量','8')}${info('实际变更前 / 后','10 / 10')}${info('拒绝原因','低于当日已占用数量9')}<div class="notice amber">1条失败记录等待补记. 业务已拒绝且未改变库存; 日志存储恢复后会补记一次.</div></div>`,'audit',true);
screens.conflict=()=>customer(`<div class="crumb">提交预订 / 库存已变化</div><div class="split"><div><div class="panel empty"><div class="icon-box">⌂</div><h1 class="title">这段行程暂时没有房了</h1><p class="muted">11月07日晚的庭院大床房刚刚订满.<br>本次预订未成功, 其他日期也没有被占用.</p><div style="margin:25px 0">${btn('换一个房型','hotel')}　${btn('调整住宿日期','search','secondary')}</div></div><div class="state-grid" style="margin-top:20px"><div class="panel"><h2 class="section">没有符合条件的酒店</h2><p class="muted small">可减少筛选条件或更换日期. 不将缺少某一晚库存的房型显示为可订.</p>${btn('重新搜索','search','secondary')}</div><div class="panel"><h2 class="section">订单当前不能取消</h2><p class="muted small">酒店刚刚完成了入住办理, 取消未生效. 当前状态: 已入住.</p>${btn('查看最新订单','order','secondary')}</div></div></div>${summary()}</div>`);
const key=new URLSearchParams(location.search).get('screen')||'search';document.getElementById('app').innerHTML=(screens[key]||screens.search)();document.documentElement.dataset.screen=key;
</script></body></html>
