<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>栖行 · 设计预览</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="ui.css"><style>main{max-width:1180px;margin:60px auto}.preview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.preview-item{background:var(--white);border:1px solid var(--line);padding:23px;transition:background .15s}.preview-item:hover{background:var(--soft)}.preview-item span{font:11px Georgia;color:#9a7051;letter-spacing:2px}.preview-item h3{font-size:15px;font-weight:500;margin:13px 0 8px}.preview-item p{font-size:11px;color:var(--muted);margin:0}.group-title{font-family:var(--font-heading);font-size:16px;font-weight:500;margin:38px 0 18px}</style><script src="screens.js"></script></head><body><header class="top"><a class="brand" href="/">栖行<span class="brand-line"></span><em>DESIGN<br>PREVIEW</em></a><span class="muted small">本地实时预览 · 1440px桌面设计</span></header><main><span class="eyebrow">QIXING / SOFTWARE DESIGN</span><h1 class="title" style="font-size:42px;margin-top:15px">所有界面, 从这里开始.</h1><p class="subtitle">修改保存后会自动刷新. 页面之间可通过业务导航跳转.</p><div id="directory"></div></main><script>Promise.resolve(window.screenCatalog).then(s=>{const groups=[['顾客端',s.filter(x=>Number(x.id.slice(3))<=8||x.id==='UI-20'||x.id==='UI-21')],['酒店与平台工作台',s.filter(x=>Number(x.id.slice(3))>=9&&Number(x.id.slice(3))<=19)]];document.querySelector('#directory').innerHTML=groups.map(([t,rows])=>`<h2 class="group-title">${t}</h2><div class="preview-grid">${rows.map(x=>`<a class="preview-item" href="ui.html?screen=${x.key}${x.query?'&'+x.query:''}"><span>${x.id} ↗</span><h3>${x.name}</h3><p>${x.module}</p></a>`).join('')}</div>`).join('')})</script></body></html>
